[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/financial-topics"
  to = "/"
  status = 301

[[redirects]]
  from = "/four-cs"
  to = "/#four-cs"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200